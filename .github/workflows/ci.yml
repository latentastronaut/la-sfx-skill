name: ci

on:
  push:
    branches: [main]
  pull_request:

# read-only: CI runs the tests and never writes to the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions are pinned to full commit SHAs; the tag is in the comment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tests (no network, about 40 seconds)
        run: uv run skills/sfx/tests/test_sfx.py
